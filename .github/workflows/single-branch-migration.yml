name: One-time single-branch migration

on:
  push:
    branches:
      - main
    paths:
      - ops/single-branch-migration.request

permissions:
  contents: write

concurrency:
  group: wickless-single-branch-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch and compile migration runner
        run: |
          python -m py_compile scripts/patch_single_branch_migration.py
          python scripts/patch_single_branch_migration.py
          python -m py_compile scripts/single_branch_migration.py

      - name: Consolidate repository and remove old branches
        run: python scripts/single_branch_migration.py
