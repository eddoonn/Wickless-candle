name: One-time ML integration status

on:
  push:
    branches:
      - main
    paths:
      - wickless_ml/integration-status.request

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record integration workflow state
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          repo = os.environ['REPOSITORY']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'wickless-ml-integration-status/1',
          }
          url = f'https://api.github.com/repos/{repo}/actions/workflows/ml-integrate-once.yml/runs?per_page=5'
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
              runs = json.load(response)['workflow_runs']
          run = runs[0] if runs else None
          jobs = []
          if run:
              jobs_url = f'https://api.github.com/repos/{repo}/actions/runs/{run["id"]}/jobs'
              with urllib.request.urlopen(urllib.request.Request(jobs_url, headers=headers), timeout=30) as response:
                  jobs = json.load(response)['jobs']
          payload = {
              'schema_version': 1,
              'generated_at_utc': datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              'run': None if run is None else {
                  'id': run['id'],
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'head_sha': run.get('head_sha'),
                  'html_url': run.get('html_url'),
              },
              'jobs': [{
                  'id': job['id'],
                  'name': job['name'],
                  'status': job.get('status'),
                  'conclusion': job.get('conclusion'),
                  'steps': [{
                      'name': step['name'],
                      'status': step.get('status'),
                      'conclusion': step.get('conclusion'),
                  } for step in job.get('steps', [])],
              } for job in jobs],
          }
          path = Path('wickless_ml/integration-status.json')
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY
          git config user.name "wickless-status[bot]"
          git config user.email "wickless-status[bot]@users.noreply.github.com"
          git add wickless_ml/integration-status.json
          git commit -m "maintenance: record ML integration status"
          git pull --rebase origin main
          git push origin HEAD:main
