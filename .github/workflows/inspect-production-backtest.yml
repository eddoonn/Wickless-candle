name: Inspect production backtest run

on:
  push:
    branches:
      - main
    paths:
      - ops/inspect-production-backtest.request

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Query latest production backtest runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p reports/maintenance/latest
          python - <<'PY'
          import json
          import os
          import urllib.request

          url = (
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}"
              "/actions/workflows/production-backtest.yml/runs?per_page=10"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "wickless-backtest-inspector/1",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          result = {
              "total_count": payload["total_count"],
              "runs": [
                  {
                      "id": row["id"],
                      "name": row["name"],
                      "event": row["event"],
                      "status": row["status"],
                      "conclusion": row["conclusion"],
                      "created_at": row["created_at"],
                      "updated_at": row["updated_at"],
                      "head_sha": row["head_sha"],
                      "run_number": row["run_number"],
                      "run_attempt": row["run_attempt"],
                      "html_url": row["html_url"],
                      "jobs_url": row["jobs_url"],
                  }
                  for row in payload["workflow_runs"]
              ],
          }
          with open(
              "reports/maintenance/latest/production-backtest-workflow.json",
              "w",
              encoding="utf-8",
          ) as handle:
              json.dump(result, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

      - name: Publish diagnostic
        run: |
          git config user.name "wickless-maintenance[bot]"
          git config user.email "wickless-maintenance[bot]@users.noreply.github.com"
          git add -- reports/maintenance/latest/production-backtest-workflow.json
          git commit -m "maintenance: record production backtest workflow status"
          git pull --rebase origin main
          git push origin HEAD:main
