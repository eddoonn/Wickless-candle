name: Production Wickless backtest

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ops/backtest.request
      - production_session.py
      - no_wick_research.py
      - wickless_bot.py
      - autoresearch/evaluator.py
      - autoresearch/policy.json
      - scripts/rerun_production_backtest.py
      - Wickless_Reversal_Strategy_v1_0.pine

permissions:
  contents: write

concurrency:
  group: wickless-production-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATA_ROOT: .runtime-data/autoresearch-datasets
      BI5_CACHE: .runtime-data/duka-bi5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore fixed June and July BID ASK data
        id: dataset-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .runtime-data/autoresearch-datasets
            .runtime-data/duka-bi5
          key: wickless-autoresearch-data-v1-complete
          restore-keys: |
            wickless-autoresearch-data-v1-partial-

      - name: Build missing seven-pair datasets
        shell: bash
        run: |
          pairs=(EURUSD GBPUSD USDJPY USDCHF USDCAD AUDUSD NZDUSD)
          june="$DATA_ROOT/dukascopy_m1_bidask_2026-06"
          july="$DATA_ROOT/dukascopy_m1_bidask_2026-07"
          retry_download() {
            local attempt
            for attempt in 1 2 3; do
              "$@" && return 0
              sleep $((attempt * 5))
            done
            return 1
          }
          if [[ ! -s "$june/manifest.json" ]]; then
            retry_download python scripts/download_m1_bid_ask.py "${pairs[@]}" \
              --start 2026-05-27 --end 2026-06-30 \
              --output "$june" --cache "$BI5_CACHE"
          fi
          if [[ ! -s "$july/manifest.json" ]]; then
            retry_download python scripts/download_m1_bid_ask.py "${pairs[@]}" \
              --start 2026-06-29 --end 2026-07-31 \
              --output "$july" --cache "$BI5_CACHE"
          fi
          test "$(find "$june" -name '*.csv.gz' | wc -l)" -eq 7
          test "$(find "$july" -name '*.csv.gz' | wc -l)" -eq 7

      - name: Save completed data cache
        if: success() && steps.dataset-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .runtime-data/autoresearch-datasets
            .runtime-data/duka-bi5
          key: wickless-autoresearch-data-v1-complete

      - name: Validate code and automation contracts
        run: |
          python -m compileall -q \
            wickless_bot.py live_scan.py time_display.py no_wick_research.py \
            live_data.py run_daemon.py production_session.py autoresearch scripts tests
          python -m unittest discover -s tests -v
          python scripts/system_health.py --output /tmp/system-health.json

      - name: Re-run reviewed production backtest
        id: backtest
        shell: bash
        run: |
          rm -rf reports/production-backtest/latest
          python scripts/rerun_production_backtest.py \
            --data-root "$DATA_ROOT" \
            --policy autoresearch/policy.json \
            --output reports/production-backtest/latest

      - name: Write UTC and London summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          summary = json.load(open("reports/production-backtest/latest/summary.json", encoding="utf-8"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("# Production Wickless backtest\n\n")
              handle.write(f"Generated UTC: `{summary['generated_at_utc']}`  \n")
              handle.write(f"Generated London: `{summary['generated_at_london']}`\n\n")
              handle.write(f"Production release: `{summary.get('production_release_sha', 'unstamped')}`  \n")
              handle.write(f"Session: `{summary.get('production_session', 'unknown')}`\n\n")
              for name, fold in summary["folds"].items():
                  metrics = fold["metrics"]
                  handle.write(
                      f"- **{name}**: {metrics['trades']} trades, "
                      f"{metrics['net_r']:+.6f}R\n"
                  )
              overall = summary["overall"]
              handle.write(
                  f"- **Overall**: {overall['trades']} trades, "
                  f"{overall['net_r']:+.6f}R, "
                  f"drawdown {overall['maximum_drawdown_r']:.6f}R\n"
              )
              handle.write(
                  f"- **Acceptance gates**: "
                  f"{'PASS' if summary['acceptance_gates']['passed'] else 'FAIL'}\n"
              )
          PY

      - name: Upload complete dual-time backtest artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-backtest-${{ github.run_id }}
          path: reports/production-backtest
          if-no-files-found: error
          retention-days: 30

      - name: Publish refreshed report to main
        id: publish
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "wickless-backtest[bot]"
          git config user.email "wickless-backtest[bot]@users.noreply.github.com"
          git add -- reports/production-backtest
          if git diff --cached --quiet; then
            echo "Backtest report is unchanged."
            exit 0
          fi
          git commit -m "backtest: refresh release-current production report"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1

      - name: Record repository publication failure
        if: always() && steps.publish.outcome == 'failure'
        shell: bash
        run: |
          {
            echo
            echo "> [!WARNING]"
            echo "> The report artifact was preserved, but the best-effort push to main failed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send fresh backtest result to Discord
        if: steps.backtest.outcome == 'success'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          summary = json.load(open("reports/production-backtest/latest/summary.json", encoding="utf-8"))
          june = summary["folds"]["june_2026"]["metrics"]
          july = summary["folds"]["july_2026"]["metrics"]
          overall = summary["overall"]
          content = "\n".join(
              (
                  "📊 **Wickless production backtest refreshed**",
                  f"Generated UTC: `{summary['generated_at_utc']}`",
                  f"Generated London: `{summary['generated_at_london']}`",
                  f"Release: `{summary.get('production_release_sha', 'unstamped')}`",
                  f"Session: `{summary.get('production_session', 'unknown')}`",
                  f"June: {june['trades']} trades, {june['net_r']:+.2f}R",
                  f"July: {july['trades']} trades, {july['net_r']:+.2f}R",
                  (
                      f"Overall: {overall['trades']} trades, "
                      f"{overall['net_r']:+.2f}R, "
                      f"drawdown {overall['maximum_drawdown_r']:.2f}R"
                  ),
                  (
                      "Candidate gates: "
                      + ("PASS" if summary["acceptance_gates"]["passed"] else "FAIL")
                  ),
              )
          )
          webhook = os.environ.get("DISCORD_WEBHOOK_URL")
          if not webhook:
              raise SystemExit("DISCORD_WEBHOOK_URL is not configured")
          body = json.dumps(
              {"content": content, "allowed_mentions": {"parse": []}}
          ).encode("utf-8")
          for attempt in range(1, 4):
              try:
                  request = urllib.request.Request(
                      webhook,
                      data=body,
                      headers={
                          "Content-Type": "application/json",
                          "User-Agent": "wickless-production-backtest/2.1",
                      },
                      method="POST",
                  )
                  urllib.request.urlopen(request, timeout=20).read()
                  break
              except (urllib.error.HTTPError, urllib.error.URLError):
                  if attempt == 3:
                      raise
                  time.sleep(2 ** (attempt - 1))
          PY

      - name: Alert Discord if production backtest fails
        if: failure()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          webhook = os.environ.get("DISCORD_WEBHOOK_URL")
          if not webhook:
              raise SystemExit(0)
          message = "❌ **Wickless production backtest failed**\n" + os.environ["RUN_URL"]
          request = urllib.request.Request(
              webhook,
              data=json.dumps(
                  {"content": message, "allowed_mentions": {"parse": []}}
              ).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "wickless-production-backtest-health/1",
              },
              method="POST",
          )
          try:
              urllib.request.urlopen(request, timeout=20).read()
          except (urllib.error.HTTPError, urllib.error.URLError) as error:
              print(f"Discord backtest failure alert failed: {error}")
          PY
