name: Launch London and New York session update

# Second revision intentionally triggers the already-registered workflow.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-session-union-launch.yml

permissions:
  contents: write

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out isolated update branch
        uses: actions/checkout@v4
        with:
          ref: session-union-main
          fetch-depth: 0

      - name: Execute the reviewed isolated apply script
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-session-union-temp.yml').read_text(
              encoding='utf-8'
          )
          marker = '        run: |\n'
          if workflow.count(marker) != 1:
              raise SystemExit('Could not isolate the apply script')
          script = textwrap.dedent(workflow.split(marker, 1)[1])
          Path('/tmp/apply-session-union.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/apply-session-union.sh
