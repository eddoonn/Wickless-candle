name: Wickless session comparison

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ops/session-comparison.request

permissions:
  contents: write

concurrency:
  group: wickless-session-comparison
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATA_ROOT: .runtime-data/autoresearch-datasets
      BI5_CACHE: .runtime-data/duka-bi5
      RESULTS_BRANCH: session-comparison-results
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore fixed June and July BID ASK data
        id: dataset-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .runtime-data/autoresearch-datasets
            .runtime-data/duka-bi5
          key: wickless-autoresearch-data-v1-complete
          restore-keys: |
            wickless-autoresearch-data-v1-partial-

      - name: Build missing seven-pair datasets
        shell: bash
        run: |
          pairs=(EURUSD GBPUSD USDJPY USDCHF USDCAD AUDUSD NZDUSD)
          june="$DATA_ROOT/dukascopy_m1_bidask_2026-06"
          july="$DATA_ROOT/dukascopy_m1_bidask_2026-07"
          if [[ ! -s "$june/manifest.json" ]]; then
            python scripts/download_m1_bid_ask.py "${pairs[@]}" \
              --start 2026-05-27 --end 2026-06-30 \
              --output "$june" --cache "$BI5_CACHE"
          fi
          if [[ ! -s "$july/manifest.json" ]]; then
            python scripts/download_m1_bid_ask.py "${pairs[@]}" \
              --start 2026-06-29 --end 2026-07-31 \
              --output "$july" --cache "$BI5_CACHE"
          fi
          test "$(find "$june" -name '*.csv.gz' | wc -l)" -eq 7
          test "$(find "$july" -name '*.csv.gz' | wc -l)" -eq 7

      - name: Validate session comparison code
        run: |
          python -m compileall -q \
            wickless_bot.py no_wick_research.py time_display.py \
            autoresearch scripts tests
          python -m unittest discover -s tests -p 'test_session_comparison.py' -v

      - name: Compare current, London, union and all-hours sessions
        run: >-
          python scripts/compare_session_windows.py
          --data-root "$DATA_ROOT"
          --policy autoresearch/policy.json
          --output reports/session-comparison/latest

      - name: Write comparison summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          summary = json.load(open("reports/session-comparison/latest/summary.json", encoding="utf-8"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("# Wickless session comparison\n\n")
              handle.write(f"Generated UTC: `{summary['generated_at_utc']}`  \n")
              handle.write(f"Generated London: `{summary['generated_at_london']}`\n\n")
              handle.write("| Session | June | July | Overall | Net R | Gates |\n")
              handle.write("|---|---:|---:|---:|---:|---|\n")
              for name, result in summary["results"].items():
                  june = result["folds"]["june_2026"]["metrics"]
                  july = result["folds"]["july_2026"]["metrics"]
                  overall = result["overall"]
                  gates = "PASS" if result["acceptance_gates"]["passed"] else "FAIL"
                  handle.write(
                      f"| {name} | {june['trades']} | {july['trades']} | "
                      f"{overall['trades']} | {overall['net_r']:+.6f} | {gates} |\n"
                  )
          PY

      - name: Upload complete session comparison artifact
        uses: actions/upload-artifact@v4
        with:
          name: session-comparison-${{ github.run_id }}
          path: reports/session-comparison
          if-no-files-found: error
          retention-days: 30

      - name: Publish comparison report to isolated results branch
        shell: bash
        run: |
          git config user.name "wickless-session-research[bot]"
          git config user.email "wickless-session-research[bot]@users.noreply.github.com"
          git add -- reports/session-comparison
          if git diff --cached --quiet; then
            echo "Session comparison is unchanged."
            exit 0
          fi
          git commit -m "research: publish London session comparison"
          git push origin "HEAD:$RESULTS_BRANCH"

      - name: Send comparison result to Discord
        if: always() && hashFiles('reports/session-comparison/latest/summary.json') != ''
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          summary = json.load(open("reports/session-comparison/latest/summary.json", encoding="utf-8"))
          lines = [
              "🕒 **Wickless London session comparison**",
              f"Generated UTC: `{summary['generated_at_utc']}`",
              f"Generated London: `{summary['generated_at_london']}`",
          ]
          for name, result in summary["results"].items():
              june = result["folds"]["june_2026"]["metrics"]
              july = result["folds"]["july_2026"]["metrics"]
              overall = result["overall"]
              gates = "PASS" if result["acceptance_gates"]["passed"] else "FAIL"
              lines.append(
                  f"**{name}** — June {june['trades']}, July {july['trades']}, "
                  f"overall {overall['trades']}, {overall['net_r']:+.2f}R, {gates}"
              )
          webhook = os.environ.get("DISCORD_WEBHOOK_URL")
          if not webhook:
              raise SystemExit("DISCORD_WEBHOOK_URL is not configured")
          request = urllib.request.Request(
              webhook,
              data=json.dumps({"content": "\n".join(lines), "allowed_mentions": {"parse": []}}).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "wickless-session-comparison/1.0",
              },
              method="POST",
          )
          try:
              urllib.request.urlopen(request, timeout=20).read()
          except (urllib.error.HTTPError, urllib.error.URLError) as error:
              raise SystemExit(f"Discord session comparison failed: {error}")
          PY
