name: Patch best-test ranking

on:
  push:
    branches:
      - main
    paths:
      - ops/best-test-ranking.request

permissions:
  contents: write

concurrency:
  group: wickless-best-test-ranking
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autoresearch/framework-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply checked ranking migration
        shell: bash
        run: |
          git config user.name "wickless-maintenance[bot]"
          git config user.email "wickless-maintenance[bot]@users.noreply.github.com"
          git fetch origin main
          git show origin/main:tools/patch_best_test_ranking.py > /tmp/patch_best_test_ranking.py
          python /tmp/patch_best_test_ranking.py

      - name: Validate fixed framework
        run: |
          python -m compileall -q autoresearch scripts tests
          python -m unittest discover -s tests -v
          python scripts/system_health.py --output /tmp/framework-health.json

      - name: Publish fixed framework
        shell: bash
        run: |
          git add -- autoresearch/nightly_batch.py tests/test_nightly_batch.py
          if ! git diff --cached --quiet; then
            git commit -m "research: rank nightly best test by gate progress"
            git push origin HEAD:autoresearch/framework-v1
          fi

      - name: Build validated production branch
        shell: bash
        run: |
          git fetch origin main autoresearch/framework-v1
          git checkout -B agent/best-test-ranking origin/main
          git checkout origin/autoresearch/framework-v1 -- \
            autoresearch/nightly_batch.py \
            tests/test_nightly_batch.py
          python -m compileall -q autoresearch scripts tests
          python -m unittest discover -s tests -v
          python scripts/system_health.py --output /tmp/production-health.json
          git add -- autoresearch/nightly_batch.py tests/test_nightly_batch.py
          if ! git diff --cached --quiet; then
            git commit -m "Rank nightly best test by gate progress"
          fi
          git push --force origin HEAD:agent/best-test-ranking
