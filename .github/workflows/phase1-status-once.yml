name: One-time Phase 1 status

on:
  push:
    branches:
      - main
    paths:
      - ops/phase1-status.request

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record latest autoresearch workflow state
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p ops
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          url = (
              f'https://api.github.com/repos/{repo}/actions/workflows/'
              'autoresearch-nightly.yml/runs?per_page=10'
          )
          request = urllib.request.Request(
              url,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'wickless-phase1-status/1',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              runs = json.load(response)['workflow_runs']
          target = next(
              (
                  row for row in runs
                  if row.get('head_sha') == '06603bbfef5a3d9e64ed4bc70223b4fc66cd88b8'
              ),
              runs[0] if runs else None,
          )
          result = {
              'schema_version': 1,
              'generated_at_utc': datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              'target_commit': '06603bbfef5a3d9e64ed4bc70223b4fc66cd88b8',
              'run': None if target is None else {
                  'id': target['id'],
                  'status': target.get('status'),
                  'conclusion': target.get('conclusion'),
                  'event': target.get('event'),
                  'created_at': target.get('created_at'),
                  'updated_at': target.get('updated_at'),
                  'run_started_at': target.get('run_started_at'),
                  'html_url': target.get('html_url'),
                  'head_sha': target.get('head_sha'),
                  'run_attempt': target.get('run_attempt'),
              },
          }
          Path('ops/phase1-status-result.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          git config user.name "wickless-status[bot]"
          git config user.email "wickless-status[bot]@users.noreply.github.com"
          git add -- ops/phase1-status-result.json
          git commit -m "maintenance: record phase 1 workflow status"
          git pull --rebase origin main
          git push origin HEAD:main
