name: Wickless scanner health heartbeat

on:
  schedule:
    - cron: "45 18 * * 1-5"
      timezone: "Europe/London"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: wickless-scanner-health
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assess scanner health and recover a stale scanner
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          mkdir -p .runtime-output
          python scripts/scanner_health.py \
            --repository "$REPOSITORY" \
            --workflow live-signals.yml \
            --ref main \
            --event-name "$GITHUB_EVENT_NAME" \
            --output .runtime-output/scanner-health.json

      - name: Upload scanner health record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-health-${{ github.run_id }}
          path: .runtime-output/scanner-health.json
          if-no-files-found: warn
          retention-days: 30
