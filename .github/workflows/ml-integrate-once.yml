name: One-time Wickless ML integration

on:
  push:
    branches:
      - main
    paths:
      - wickless_ml/integration.request

permissions:
  contents: write

concurrency:
  group: wickless-ml-integration
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply Phase 3 and Phase 4 integration
        run: python scripts/apply_ml_learning_patch.py

      - name: Compile repository
        run: >-
          python -m compileall -q
          wickless_bot.py no_wick_research.py live_data.py live_scan.py
          run_daemon.py production_session.py time_display.py
          autoresearch wickless_ml scripts tests

      - name: Run complete unit suite
        run: python -m unittest discover -s tests -v

      - name: Run system health audit
        run: python scripts/system_health.py --output /tmp/system-health.json

      - name: Publish validated ML integration
        shell: bash
        run: |
          git config user.name "wickless-ml-integration[bot]"
          git config user.email "wickless-ml-integration[bot]@users.noreply.github.com"
          git add -- \
            wickless_bot.py \
            scripts/system_health.py \
            wickless_ml/runtime.py \
            wickless_ml/training.py \
            tests/test_ml_learning.py
          git commit -m "ml: integrate shadow learning and guarded deployment"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-integration-${{ github.run_id }}
          path: /tmp/system-health.json
          if-no-files-found: warn
          retention-days: 14
