name: Discord connectivity test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/discord-connectivity-test.yml
      - ops/discord-test.request

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send clearly labelled non-trading Discord test
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python tools/test_discord_webhook.py
