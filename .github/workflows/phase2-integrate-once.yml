name: One-time Phase 2 integration

on:
  push:
    branches:
      - main
    paths:
      - ops/phase2-integration.request

permissions:
  contents: write

concurrency:
  group: wickless-phase2-integration
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply Phase 2 integration
        run: python scripts/run_phase2_patch.py

      - name: Compile repository
        run: >-
          python -m compileall -q
          wickless_bot.py no_wick_research.py live_data.py live_scan.py
          run_daemon.py production_session.py time_display.py
          autoresearch scripts tests

      - name: Run complete unit suite
        run: python -m unittest discover -s tests -v

      - name: Run system health audit
        run: python scripts/system_health.py --output /tmp/system-health.json

      - name: Publish validated Phase 2 integration
        shell: bash
        run: |
          git config user.name "wickless-phase2[bot]"
          git config user.email "wickless-phase2[bot]@users.noreply.github.com"
          git add -- \
            autoresearch/phase2_optimizer.py \
            autoresearch/nightly_batch.py \
            autoresearch/program.md \
            scripts/system_health.py \
            tests/test_phase2_optimizer.py
          git commit -m "autoresearch: integrate phase 2 optimizer"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-integration-${{ github.run_id }}
          path: /tmp/system-health.json
          if-no-files-found: warn
          retention-days: 14
