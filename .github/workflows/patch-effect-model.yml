name: Patch autoresearch effect model

on:
  push:
    branches:
      - main
    paths:
      - ops/effect-model.request

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autoresearch/framework-v1
          fetch-depth: 0

      - name: Migrate nightly reporting to realized trade effects
        shell: bash
        run: |
          git config user.name "wickless-maintenance[bot]"
          git config user.email "wickless-maintenance[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path

          path = Path("autoresearch/nightly_batch.py")
          source = path.read_text(encoding="utf-8")
          replacements = [
              (
                  '    """Return the strongest experiment that changed benchmark behavior."""\n\n'
                  '    effectful = [output for output in outputs if output.get("effect") != "no-effect"]\n'
                  '    if not effectful:\n'
                  '        return None\n'
                  '    return max(effectful, key=lambda output: objective_tuple(output, policy))',
                  '    """Return the strongest experiment that changed realized trades."""\n\n'
                  '    trade_changed = [\n'
                  '        output for output in outputs if output.get("effect") == "trade-changed"\n'
                  '    ]\n'
                  '    if not trade_changed:\n'
                  '        return None\n'
                  '    return max(trade_changed, key=lambda output: objective_tuple(output, policy))',
              ),
              (
                  '            f"Tested **{summary[\'tested\']}** | Changed **{summary[\'changed\']}** | "\n'
                  '            f"No effect **{summary[\'no_effect\']}** | KEEP **{summary[\'kept\']}**"',
                  '            f"Tested **{summary[\'tested\']}** | Trade changed **{summary[\'trade_changed\']}** | "\n'
                  '            f"Funnel only **{summary[\'funnel_only\']}** | "\n'
                  '            f"No effect **{summary[\'no_effect\']}** | KEEP **{summary[\'kept\']}**"',
              ),
              (
                  '        lines.append("**Best changed test — none**")\n'
                  '        if summary.get("tested"):\n'
                  '            lines.append("Every completed test reproduced benchmark behavior exactly.")',
                  '        lines.append("**Best trade-changing test — none**")\n'
                  '        if summary.get("funnel_only"):\n'
                  '            lines.append(\n'
                  '                f"{summary[\'funnel_only\']} test(s) changed only the rejection funnel; "\n'
                  '                "realized trades stayed identical."\n'
                  '            )\n'
                  '        elif summary.get("tested"):\n'
                  '            lines.append("Every completed test reproduced benchmark behavior exactly.")',
              ),
              (
                  '*_result_lines("Best changed test", best),',
                  '*_result_lines("Best trade-changing test", best),',
              ),
              (
                  '            suffix = "no-effect" if output["effect"] == "no-effect" else output["status"]',
                  '            suffix = (\n'
                  '                output["effect"]\n'
                  '                if output["effect"] != "trade-changed"\n'
                  '                else output["status"]\n'
                  '            )',
              ),
              (
                  '    no_effect = sum(output["effect"] == "no-effect" for output in outputs)\n'
                  '    summary = {',
                  '    trade_changed = sum(\n'
                  '        output["effect"] == "trade-changed" for output in outputs\n'
                  '    )\n'
                  '    funnel_only = sum(\n'
                  '        output["effect"] == "funnel-only" for output in outputs\n'
                  '    )\n'
                  '    no_effect = sum(output["effect"] == "no-effect" for output in outputs)\n'
                  '    summary = {',
              ),
              (
                  '        "changed": len(outputs) - no_effect,\n'
                  '        "no_effect": no_effect,',
                  '        "trade_changed": trade_changed,\n'
                  '        "funnel_only": funnel_only,\n'
                  '        "no_effect": no_effect,',
              ),
          ]
          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f"Expected nightly migration block not found:\n{old}")
              source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")
          PY
          git add -- autoresearch/nightly_batch.py
          git commit -m "research: distinguish funnel and trade effects in nightly reports"
          git push origin HEAD:autoresearch/framework-v1
