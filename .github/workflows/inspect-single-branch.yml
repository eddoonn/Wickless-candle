name: Inspect single-branch migration

on:
  push:
    branches:
      - main
    paths:
      - ops/inspect-single-branch.request

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record migration workflow status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p reports/maintenance/latest
          python - <<'PY'
          import json
          import os
          import urllib.request

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "wickless-single-branch-inspector/1",
          }
          base = f"https://api.github.com/repos/{os.environ['REPOSITORY']}"
          request = urllib.request.Request(
              base + "/actions/workflows/single-branch-migration.yml/runs?per_page=5",
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          runs = payload.get("workflow_runs", [])
          result = {"runs": []}
          for row in runs:
              run = {
                  key: row.get(key)
                  for key in (
                      "id", "status", "conclusion", "event", "created_at",
                      "updated_at", "head_sha", "run_number", "html_url"
                  )
              }
              jobs_request = urllib.request.Request(
                  base + f"/actions/runs/{row['id']}/jobs?per_page=100",
                  headers=headers,
              )
              with urllib.request.urlopen(jobs_request, timeout=30) as response:
                  jobs_payload = json.load(response)
              run["jobs"] = [
                  {
                      "id": job.get("id"),
                      "name": job.get("name"),
                      "status": job.get("status"),
                      "conclusion": job.get("conclusion"),
                      "steps": [
                          {
                              "name": step.get("name"),
                              "status": step.get("status"),
                              "conclusion": step.get("conclusion"),
                              "number": step.get("number"),
                          }
                          for step in job.get("steps", [])
                      ],
                  }
                  for job in jobs_payload.get("jobs", [])
              ]
              result["runs"].append(run)
          with open(
              "reports/maintenance/latest/single-branch-migration.json",
              "w",
              encoding="utf-8",
          ) as handle:
              json.dump(result, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

      - name: Publish diagnostic and remove inspector
        run: |
          git config user.name "wickless-maintenance[bot]"
          git config user.email "wickless-maintenance[bot]@users.noreply.github.com"
          git rm -f .github/workflows/inspect-single-branch.yml
          git rm -f ops/inspect-single-branch.request
          git add -- reports/maintenance/latest/single-branch-migration.json
          git commit -m "maintenance: record single-branch migration status"
          git pull --rebase origin main
          git push origin HEAD:main
