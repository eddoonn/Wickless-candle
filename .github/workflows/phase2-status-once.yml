name: One-time Phase 2 status

on:
  push:
    branches:
      - main
    paths:
      - ops/phase2-status.request

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record Phase 2 integration state
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p ops
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'wickless-phase2-status/1',
          }
          runs_url = (
              f'https://api.github.com/repos/{repo}/actions/workflows/'
              'phase2-integrate-once.yml/runs?per_page=5'
          )
          with urllib.request.urlopen(
              urllib.request.Request(runs_url, headers=headers), timeout=30
          ) as response:
              runs = json.load(response)['workflow_runs']
          run = runs[0] if runs else None
          jobs = []
          if run is not None:
              jobs_url = f'https://api.github.com/repos/{repo}/actions/runs/{run["id"]}/jobs'
              with urllib.request.urlopen(
                  urllib.request.Request(jobs_url, headers=headers), timeout=30
              ) as response:
                  jobs = json.load(response)['jobs']
          result = {
              'schema_version': 1,
              'generated_at_utc': datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              'run': None if run is None else {
                  'id': run['id'],
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'head_sha': run.get('head_sha'),
                  'html_url': run.get('html_url'),
                  'created_at': run.get('created_at'),
                  'updated_at': run.get('updated_at'),
              },
              'jobs': [
                  {
                      'id': job['id'],
                      'name': job['name'],
                      'status': job.get('status'),
                      'conclusion': job.get('conclusion'),
                      'steps': [
                          {
                              'name': step['name'],
                              'status': step.get('status'),
                              'conclusion': step.get('conclusion'),
                          }
                          for step in job.get('steps', [])
                      ],
                  }
                  for job in jobs
              ],
          }
          Path('ops/phase2-status-result.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          git config user.name "wickless-status[bot]"
          git config user.email "wickless-status[bot]@users.noreply.github.com"
          git add -- ops/phase2-status-result.json
          git commit -m "maintenance: record phase 2 integration status"
          git pull --rebase origin main
          git push origin HEAD:main
