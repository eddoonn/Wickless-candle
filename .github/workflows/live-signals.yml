name: Live Wickless 15m Discord signals

on:
  schedule:
    # GitHub cron is UTC. The scanner itself accepts only finalized 15m candles.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wickless-live-signals
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore cross-run signal state
        uses: actions/cache/restore@v4
        with:
          path: .signal-state
          key: wickless-signal-state-${{ github.run_id }}
          restore-keys: |
            wickless-signal-state-

      - name: Download indicator warm-up and pending-order history
        run: python live_data.py --data-dir .runtime-data

      - name: Post every unseen origin-zone reclaim entry
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: >-
          python wickless_bot.py scan
          --data-dir .runtime-data
          --state .signal-state/seen.json
          --max-signal-age-seconds 120
          --max-quote-age-seconds 120
          --max-entry-deviation-r 0.25
          --research-lookback-seconds 2700

      - name: Save cross-run signal state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .signal-state
          key: wickless-signal-state-${{ github.run_id }}
