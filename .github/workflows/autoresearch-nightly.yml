name: Nightly Wickless autoresearch

on:
  push:
    branches:
      - autoresearch/framework-v1
    paths:
      - autoresearch/baseline-refresh.request
      - autoresearch/bootstrap-benchmark.request
      - autoresearch/nightly-run.request
  schedule:
    - cron: "0 23 * * *"
      timezone: "Europe/London"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of controlled experiments (1-20)"
        required: false
        default: "12"
      refresh_baseline:
        description: "Re-evaluate unmodified production defaults as the reference"
        required: false
        type: boolean
        default: false
      bootstrap_benchmark:
        description: "Search the expanded space and promote the strongest valid result"
        required: false
        type: boolean
        default: false
      bootstrap_limit:
        description: "Maximum bootstrap candidates; 0 evaluates the complete search space"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: wickless-autoresearch-nightly
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FRAMEWORK_BRANCH: autoresearch/framework-v1
      NIGHTLY_BRANCH: autoresearch/nightly
      DATA_ROOT: .runtime-data/autoresearch-datasets
      BI5_CACHE: .runtime-data/duka-bi5
      BATCH_SIZE: ${{ github.event.inputs.batch_size || '12' }}
      REFRESH_INPUT: ${{ github.event.inputs.refresh_baseline || 'false' }}
      BOOTSTRAP_INPUT: ${{ github.event.inputs.bootstrap_benchmark || 'false' }}
      BOOTSTRAP_LIMIT: ${{ github.event.inputs.bootstrap_limit || '0' }}
    steps:
      - name: Check out the fixed framework
        uses: actions/checkout@v4
        with:
          ref: autoresearch/framework-v1
          fetch-depth: 0

      - name: Resolve requested mode
        shell: bash
        run: |
          mode=nightly
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            changed="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
            if grep -qx 'autoresearch/bootstrap-benchmark.request' <<<"$changed"; then
              mode=bootstrap
            elif grep -qx 'autoresearch/baseline-refresh.request' <<<"$changed"; then
              mode=refresh
            fi
          elif [[ "$BOOTSTRAP_INPUT" == "true" ]]; then
            mode=bootstrap
          elif [[ "$REFRESH_INPUT" == "true" ]]; then
            mode=refresh
          fi
          echo "RUN_MODE=$mode" >> "$GITHUB_ENV"
          echo "Resolved autoresearch mode: $mode"

      - name: Resume the isolated nightly branch
        shell: bash
        run: |
          git config user.name "wickless-autoresearch[bot]"
          git config user.email "wickless-autoresearch[bot]@users.noreply.github.com"
          git fetch origin "$FRAMEWORK_BRANCH"
          if git ls-remote --exit-code --heads origin "refs/heads/$NIGHTLY_BRANCH"; then
            git fetch origin "$NIGHTLY_BRANCH"
            git checkout -B "$NIGHTLY_BRANCH" "origin/$NIGHTLY_BRANCH"
            git merge --no-edit "origin/$FRAMEWORK_BRANCH"
          else
            git checkout -b "$NIGHTLY_BRANCH" "origin/$FRAMEWORK_BRANCH"
          fi

      - name: Require Discord notifications
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: test -n "$DISCORD_WEBHOOK_URL"

      - name: Restore fixed BID ASK research data
        id: dataset-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .runtime-data/autoresearch-datasets
            .runtime-data/duka-bi5
          key: wickless-autoresearch-data-v1-complete
          restore-keys: |
            wickless-autoresearch-data-v1-partial-

      - name: Build missing June and July BID ASK datasets
        shell: bash
        run: |
          pairs=(EURUSD GBPUSD USDJPY USDCHF USDCAD AUDUSD NZDUSD)
          june="$DATA_ROOT/dukascopy_m1_bidask_2026-06"
          july="$DATA_ROOT/dukascopy_m1_bidask_2026-07"
          if [[ ! -s "$june/manifest.json" ]]; then
            python scripts/download_m1_bid_ask.py "${pairs[@]}" \
              --start 2026-05-27 --end 2026-06-30 \
              --output "$june" --cache "$BI5_CACHE"
          fi
          if [[ ! -s "$july/manifest.json" ]]; then
            python scripts/download_m1_bid_ask.py "${pairs[@]}" \
              --start 2026-06-29 --end 2026-07-31 \
              --output "$july" --cache "$BI5_CACHE"
          fi
          test "$(find "$june" -name '*.csv.gz' | wc -l)" -eq 7
          test "$(find "$july" -name '*.csv.gz' | wc -l)" -eq 7

      - name: Save complete research data
        if: success() && steps.dataset-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .runtime-data/autoresearch-datasets
            .runtime-data/duka-bi5
          key: wickless-autoresearch-data-v1-complete

      - name: Save partial download for automatic retry
        if: failure() && steps.dataset-cache.outcome == 'success' && steps.dataset-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .runtime-data/autoresearch-datasets
            .runtime-data/duka-bi5
          key: wickless-autoresearch-data-v1-partial-${{ github.run_id }}

      - name: Ensure production reference benchmark
        if: env.RUN_MODE == 'nightly'
        shell: bash
        run: |
          python -m autoresearch.reference_benchmark \
            --data-root "$DATA_ROOT" \
            --policy autoresearch/policy.json \
            --ledger autoresearch/results.jsonl \
            --incumbent autoresearch/incumbent.json \
            --runs autoresearch/runs \
            --attempts autoresearch/attempts.log \
            | tee /tmp/reference-benchmark.json
          git add -A -- \
            autoresearch/incumbent.json \
            autoresearch/results.jsonl \
            autoresearch/attempts.log \
            autoresearch/runs
          if ! git diff --cached --quiet; then
            git commit -m "autoresearch: restore production reference benchmark"
          fi

      - name: Refresh production reference benchmark
        if: env.RUN_MODE == 'refresh'
        shell: bash
        run: |
          python -m autoresearch.reference_benchmark \
            --data-root "$DATA_ROOT" \
            --policy autoresearch/policy.json \
            --ledger autoresearch/results.jsonl \
            --incumbent autoresearch/incumbent.json \
            --runs autoresearch/runs \
            --attempts autoresearch/attempts.log \
            --force \
            | tee /tmp/baseline-refresh.json
          git add -A -- \
            autoresearch/incumbent.json \
            autoresearch/results.jsonl \
            autoresearch/attempts.log \
            autoresearch/runs
          git commit -m "autoresearch: refresh production reference benchmark"

      - name: Bootstrap the strongest valid benchmark
        if: env.RUN_MODE == 'bootstrap'
        shell: bash
        run: |
          rm -f /tmp/bootstrap-incumbent.json
          python -m autoresearch.bootstrap_benchmark \
            --data-root "$DATA_ROOT" \
            --policy autoresearch/policy.json \
            --ledger autoresearch/results.jsonl \
            --attempts autoresearch/attempts.log \
            --incumbent /tmp/bootstrap-incumbent.json \
            --runs autoresearch/runs \
            --max-candidates "$BOOTSTRAP_LIMIT"
          if [[ -s /tmp/bootstrap-incumbent.json ]]; then
            cp /tmp/bootstrap-incumbent.json autoresearch/incumbent.json
          fi
          git add -A -- autoresearch
          git commit -m "autoresearch: bootstrap benchmark search"

      - name: Run worker and coach experiment loop
        if: env.RUN_MODE == 'nightly'
        run: >-
          python -m autoresearch.nightly_batch
          --data-root "$DATA_ROOT"
          --batch-size "$BATCH_SIZE"
          --coach-interval 20
          --git-commits
          --no-discord

      - name: Restore neutral candidate surface
        shell: bash
        run: |
          cat > autoresearch/candidate.py <<'PY'
          """The only strategy file an autoresearch agent may edit."""

          CANDIDATE = {
              "name": "production-baseline",
              "description": "Wickless-candle production defaults at 12250ed.",
              "parameters": {},
          }
          PY
          git add -- autoresearch/candidate.py
          if ! git diff --cached --quiet; then
            git commit -m "autoresearch: reset candidate surface"
          fi

      - name: Validate code and protected scope
        shell: bash
        run: |
          python -m compileall -q \
            wickless_bot.py no_wick_research.py live_data.py run_daemon.py \
            autoresearch scripts tests
          python -m unittest discover -s tests -v
          python autoresearch/verify_scope.py \
            --base "origin/$FRAMEWORK_BRANCH"

      - name: Publish audit history to the nightly branch only
        run: git push origin "$NIGHTLY_BRANCH"

      - name: Notify Discord of nightly benchmark and best test
        if: env.RUN_MODE == 'nightly'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from autoresearch.nightly_batch import discord_summary, post_discord

          summaries = list(Path("autoresearch/runs").glob("nightly-*.json"))
          if not summaries:
              raise SystemExit("No nightly summary was produced")
          latest = max(summaries, key=lambda path: path.stat().st_mtime_ns)
          summary = json.loads(latest.read_text(encoding="utf-8"))
          message = discord_summary(summary)
          print(message)
          if not post_discord(message):
              raise SystemExit("DISCORD_WEBHOOK_URL is not configured")
          PY

      - name: Notify Discord of bootstrap result
        if: env.RUN_MODE == 'bootstrap'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          summary = json.load(open("autoresearch/runs/bootstrap-summary.json", encoding="utf-8"))
          selected = summary.get("selected")
          if selected is None:
              message = (
                  "⚠️ **Wickless bootstrap completed without a promoted benchmark**\n"
                  f"Tested: {summary['tested']} | Passing all gates: 0\n"
                  "Nightly research will continue against the existing reference benchmark."
              )
          else:
              june = selected["folds"]["june_2026"]
              july = selected["folds"]["july_2026"]
              overall = selected["overall"]
              message = "\n".join(
                  (
                      "✅ **Wickless bootstrap benchmark promoted**",
                      f"Source: **{selected['source_candidate']}**",
                      f"Tested: {summary['tested']} | Passing all gates: {summary['passing']}",
                      f"June: {june['trades']} trades, {june['net_r']:+.2f}R",
                      f"July: {july['trades']} trades, {july['net_r']:+.2f}R",
                      (
                          f"Overall: {overall['trades']} trades, "
                          f"{overall['net_r']:+.2f}R, "
                          f"drawdown {overall['maximum_drawdown_r']:.2f}R"
                      ),
                  )
              )
          webhook = os.environ.get("DISCORD_WEBHOOK_URL")
          if not webhook:
              raise SystemExit(0)
          request = urllib.request.Request(
              webhook,
              data=json.dumps({"content": message}).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "wickless-autoresearch/1",
              },
              method="POST",
          )
          try:
              urllib.request.urlopen(request, timeout=20).read()
          except (urllib.error.HTTPError, urllib.error.URLError) as error:
              print(f"Discord bootstrap notification failed: {error}")
          PY

      - name: Notify Discord of refreshed reference
        if: env.RUN_MODE == 'refresh'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          result = json.load(open("/tmp/baseline-refresh.json", encoding="utf-8"))
          june = result["folds"]["june_2026"]
          july = result["folds"]["july_2026"]
          overall = result["overall"]
          message = "\n".join(
              (
                  "📌 **Wickless production reference refreshed**",
                  f"June: {june['trades']} trades, {june['net_r']:+.2f}R",
                  f"July: {july['trades']} trades, {july['net_r']:+.2f}R",
                  f"Overall: {overall['trades']} trades, {overall['net_r']:+.2f}R",
                  "Candidate acceptance gates remain unchanged.",
              )
          )
          webhook = os.environ.get("DISCORD_WEBHOOK_URL")
          if not webhook:
              raise SystemExit(0)
          request = urllib.request.Request(
              webhook,
              data=json.dumps({"content": message}).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "wickless-autoresearch/1",
              },
              method="POST",
          )
          try:
              urllib.request.urlopen(request, timeout=20).read()
          except (urllib.error.HTTPError, urllib.error.URLError) as error:
              print(f"Discord reference notification failed: {error}")
          PY

      - name: Alert Discord if the batch fails
        if: failure()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          webhook = os.environ.get("DISCORD_WEBHOOK_URL")
          if webhook:
              message = "❌ **Wickless autoresearch failed**\n" + os.environ["RUN_URL"]
              request = urllib.request.Request(
                  webhook,
                  data=json.dumps({"content": message}).encode(),
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "wickless-autoresearch/1",
                  },
                  method="POST",
              )
              try:
                  urllib.request.urlopen(request, timeout=20).read()
              except (urllib.error.HTTPError, urllib.error.URLError) as error:
                  print(f"Discord failure alert failed: {error}")
          PY
