name: Wickless autoresearch guard

on:
  push:
    branches:
      - "autoresearch/**"
  pull_request:
    paths:
      - "autoresearch/**"
      - ".github/workflows/autoresearch.yml"
      - "tests/test_autoresearch.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autoresearch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile and run repository tests
        run: |
          python -m compileall -q \
            wickless_bot.py no_wick_research.py live_data.py run_daemon.py \
            autoresearch tests
          python -m unittest discover -s tests -v

      - name: Protect fixed harness on experiment branches
        if: >-
          github.ref_name != 'autoresearch/framework-v1' &&
          github.head_ref != 'autoresearch/framework-v1'
        run: |
          git fetch origin autoresearch/framework-v1:refs/remotes/origin/autoresearch/framework-v1
          python autoresearch/verify_scope.py \
            --base origin/autoresearch/framework-v1
